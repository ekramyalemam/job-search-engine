name: Find jobs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Search for jobs
        run: python find_jobs.py

      - name: Save results to the repo
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add results
          git commit -m "Update job results" || echo "Nothing new to save"
          git push
