name: Find jobs

# Started every day at 5:00 am Toronto by the cron-job.org timer (it calls "workflow_dispatch").
# GitHub's own schedule was removed because it starts hours late.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Search for jobs
        run: python find_jobs.py

      - name: Save results to the repo
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add results
          git commit -m "Update job results" || echo "Nothing new to save"
          git pull --rebase
          git push
