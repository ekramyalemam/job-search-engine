# =====================================================================
# JOB SEARCH SETTINGS (v15) - Phase 1 (public repo ekramyalemam/job-search-engine)
# Works with the find_jobs.py you already have (v14, unchanged). REPLACE THE WHOLE FILE with this one.
# What is new in v15: 3 new search places - Jeddah, Dammam (Saudi Arabia) and all of Canada (remote jobs
# listed for Canada are included). Everything else is exactly as in v14.
#
# What is new in v14:
#   1. 18 search words (was 8), including the plain "service delivery manager".
#   2. 25 results per search (was 20), Abu Dhabi added.
#   3. RED HAT is a FOCUS company: its own searches (9 words, 14 days back, also Canada-wide) and
#      its jobs skip the title gates, so an unusual title is never thrown away.
#      Every Red Hat job found is listed in results/focus_latest.csv - nothing is hidden.
# =====================================================================

sites:
  - linkedin
  - indeed

optional_sites:
  - bayt
  - google
  - glassdoor
  - zip_recruiter

# ---------------------------------------------------------------------
# SEARCH WORDS - each word is searched in every location, on every site.
# ---------------------------------------------------------------------
search_terms:
  - "service delivery manager"
  - "senior service delivery manager"
  - "service delivery director"
  - "head of service delivery"
  - "managed services director"
  - "managed services manager"
  - "customer operations manager telecom"
  - "network operations manager"
  - "NOC manager"
  - "major incident manager"
  - "cloud service delivery manager"
  - "telecom program manager"
  - "technical account manager"
  - "customer success manager"
  - "delivery director"
  - "service operations manager"
  - "service assurance manager"
  - "engagement manager managed services"

locations:
  - name: "Dubai, UAE"
    country: "United Arab Emirates"
  - name: "Abu Dhabi, UAE"
    country: "United Arab Emirates"
  - name: "Doha, Qatar"
    country: "Qatar"
  - name: "Riyadh, Saudi Arabia"
    country: "Saudi Arabia"
  - name: "Toronto, Canada"
    country: "Canada"
  - name: "Canada"
    country: "Canada"
  - name: "Jeddah, Saudi Arabia"
    country: "Saudi Arabia"
  - name: "Dammam, Saudi Arabia"
    country: "Saudi Arabia"
  - name: "United States"
    country: "USA"

employment_types:
  - fulltime

remote_only: false

