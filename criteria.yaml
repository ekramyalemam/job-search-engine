# JOB SEARCH SETTINGS - edit anytime

# Boards we trust (tested by others, work best)
sites:
  - linkedin
  - indeed
  - google

# Boards that may fail or be blocked. The script tries them
# and skips any that don't work.
optional_sites:
  - bayt
  - glassdoor
  - zip_recruiter

search_terms:
  - "operations manager telecom"
  - "NOC manager"
  - "delivery manager telecom"
  - "incident manager"
  - "project manager network"

locations:
  - name: "Dubai, UAE"
    country: "United Arab Emirates"
  - name: "Doha, Qatar"
    country: "Qatar"
  - name: "Riyadh, Saudi Arabia"
    country: "Saudi Arabia"
  - name: "Toronto, Canada"
    country: "Canada"
  - name: "United States"
    country: "USA"

employment_types:
  - fulltime

remote_only: false

# MAIN FILTER: a job is kept if these words appear in its
# title, description or industry.
industries:
  - telecom
  - network
  - cloud

seniority_keywords:
  - senior
  - manager
  - head
  - lead

job_functions:
  - operations
  - delivery
  - incident
  - project

# BONUS list: jobs from these companies will be marked
# as priority and shown first. Nothing is removed.
priority_companies:
  - Verizon
  - Comcast
  - AT&T
  - T-Mobile
  - Salesforce
  - Charter Communications
  - America Movil
  - Cisco
  - HPE
  - Bell
  - Rogers
  - TELUS
  - Lumen
  - Cox Communications
  - Motorola Solutions
  - Palo Alto Networks
  - Arista Networks
  - Fortinet
  - Altice USA
  - Ciena
  - CommScope

days_back: 7
results_per_search: 20
min_match_percent: 75

# Fetch full job text from LinkedIn so the industry filter can read it.
# Slower, and LinkedIn may block more. Set to false to go back to fast mode.
linkedin_fetch_description: true

# Skip a site that finds nothing after this many searches.
skip_site_after_failures: 4
