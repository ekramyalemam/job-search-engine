# Preferred locations (+1 in the ranking)
preferred_locations: [Dubai, Abu Dhabi, UAE, Doha, Qatar, Riyadh, Jeddah, Dammam, Saudi, Toronto, Ontario, Canada]

days_back: 7
results_per_search: 25
min_match_percent: 75

linkedin_fetch_description: true
skip_site_after_failures: 4

# ---------------------------------------------------------------------
# FOCUS COMPANIES (new in v14)
# Jobs from these companies skip the title gates (role / seniority / "engineer" / exclude words).
# They go to the STRONG list when the score is good, otherwise to the MAYBE list with the reason "FOCUS ...".
# Only the words in focus_drop_words below remove a focus job.
# EVERY focus job that was found is written to results/focus_latest.csv, whatever happened to it.
# ---------------------------------------------------------------------
focus_companies:
  - Red Hat

focus_drop_words:
  - intern
  - internship
  - co-op
  - recruiter
  - recruiting
  - recruitment
  - human resources
  - payroll
  - legal
  - paralegal
  - sales
  - account executive
  - software engineer
  - software developer
  - developer
  - quality engineer
  - site reliability engineer
  - technical writer
  - data scientist

# ---------------------------------------------------------------------
# COMPANY SEARCHES: searches aimed at one named company, so big players are never missed.
# Each company is searched with company_terms (or its own 'terms') in every location
# (or only the countries listed in 'where'). Only jobs from THAT company are kept.
# Optional per company: terms, extra_locations, results, days_back.
# An empty term "" means "any job of that company".
# ---------------------------------------------------------------------
company_terms:
  - "service delivery manager"
  - "operations manager"
company_results_per_search: 25
company_searches:
  - name: Red Hat
    results: 40
    days_back: 14
    terms:
      - ""
      - "technical account manager"
      - "customer success manager"
      - "delivery manager"
      - "program manager"
      - "service delivery"
      - "operations manager"
      - "managed services"
    # (Canada used to be listed here as an extra place; it is now a normal place above.)
  - {name: Nokia}
  - {name: Ericsson}
  - {name: Cisco}
  - {name: Verizon, where: [USA]}
  - {name: "AT&T", where: [USA]}
  - {name: "T-Mobile", where: [USA]}
  - {name: Comcast, where: [USA]}
  - {name: Charter Communications, where: [USA]}
  - {name: Lumen, where: [USA]}
