# JOB SEARCH SETTINGS - edit anytime

# Boards we trust (tested by others, work best)
sites:
  - linkedin
  - indeed
  - google

# Boards that may fail or be blocked. The script tries them
# and skips any that don't work.
optional_sites:
  - bayt
  - glassdoor
  - zip_recruiter

search_terms:
  - "operations manager telecom"
  - "NOC manager"
  - "delivery manager telecom"
  - "incident manager"
  - "project manager network"

locations:
  - name: "Dubai, UAE"
    country: "United Arab Emirates"
  - name: "Doha, Qatar"
    country: "Qatar"
  - name: "Riyadh, Saudi Arabia"
    country: "Saudi Arabia"
  - name: "Toronto, Canada"
    country: "Canada"
  - name: "United States"
    country: "USA"

employment_types:
  - fulltime

remote_only: false

industries:
  - telecom
  - networking
  - cloud

seniority_keywords:
  - senior
  - manager
  - head
  - lead

job_functions:
  - operations
  - delivery
  - incident
  - project

# Set to true to keep ONLY jobs from the companies below.
# Set to false to see jobs from every company.
only_these_companies: false

companies:
  - Verizon
  - Comcast
  - AT&T
  - T-Mobile
  - Salesforce
  - Char